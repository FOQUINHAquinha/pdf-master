name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Modelos de idioma do OCR (tessdata_fast, Apache-2.0): incorporados ao programa na compilação.
      - name: Baixar modelos de idioma do OCR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          ./tools/obter-modelos-ocr.ps1 2>&1 | Tee-Object ci-out/ocr-modelos.log

      # FFmpeg (variante LGPL de BtbN/FFmpeg-Builds): incorporado ao programa para a compressão de vídeo.
      - name: Baixar o FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          ./tools/obter-ffmpeg.ps1 2>&1 | Tee-Object ci-out/ffmpeg.log
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit 1 }

      - name: Compilar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          "${{ github.sha }}" | Out-File ci-out/commit.txt -Encoding utf8
          dotnet build PDFMaster.sln -c Release -nologo 2>&1 | Tee-Object ci-out/build.log
          "build exit=$LASTEXITCODE" | Out-File ci-out/status.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Necessário para testar de verdade as conversões Office → PDF e PDF → Word com layout.
      - name: Instalar LibreOffice (dependência opcional das conversões)
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress 2>&1 | Select-Object -Last 15 | Tee-Object ci-out/libreoffice.log
          "soffice: $(Test-Path 'C:\Program Files\LibreOffice\program\soffice.com')" | Out-File ci-out/libreoffice.log -Append -Encoding utf8

      # veraPDF (validador PDF/A de referência; GPLv3+/MPLv2+): usado só aqui, para confirmar as conversões
      # PDF/A nos testes. Não é distribuído com o programa. Se a instalação falhar, os testes seguem sem ele.
      - name: Instalar veraPDF (validador PDF/A, só para os testes)
        shell: pwsh
        continue-on-error: true
        run: |
          $log = 'ci-out/verapdf.log'
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'verapdf.zip'
          $ok = $false
          foreach ($url in @('https://software.verapdf.org/rel/verapdf-installer.zip', 'https://software.verapdf.org/releases/verapdf-installer.zip', 'http://downloads.verapdf.org/rel/verapdf-installer.zip')) {
            try { Invoke-WebRequest $url -OutFile $zip -MaximumRedirection 5; "baixado: $url" | Out-File $log -Append; $ok = $true; break }
            catch { "falhou: $url $_" | Out-File $log -Append }
          }
          if (-not $ok) { exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'verapdf-inst'
          Expand-Archive $zip -DestinationPath $dir -Force
          $jar = Get-ChildItem $dir -Recurse -Filter '*.jar' | Where-Object { $_.Name -like '*installer*' } | Select-Object -First 1
          "jar: $($jar.FullName)" | Out-File $log -Append
          $xml = @(
            '<?xml version="1.0" encoding="UTF-8" standalone="no"?>',
            '<AutomatedInstallation langpack="eng">',
            '  <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>',
            '  <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>C:\veraPDF</installpath></com.izforge.izpack.panels.target.TargetPanel>',
            '  <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">',
            '    <pack index="0" name="veraPDF GUI" selected="true"/>',
            '    <pack index="1" name="veraPDF Batch files" selected="true"/>',
            '    <pack index="2" name="veraPDF Validation model" selected="false"/>',
            '    <pack index="3" name="veraPDF Documentation" selected="false"/>',
            '    <pack index="4" name="veraPDF Sample Plugins" selected="false"/>',
            '  </com.izforge.izpack.panels.packs.PacksPanel>',
            '  <com.izforge.izpack.panels.install.InstallPanel id="install"/>',
            '  <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>',
            '</AutomatedInstallation>')
          $auto = Join-Path $env:RUNNER_TEMP 'auto-install.xml'
          $xml | Out-File $auto -Encoding utf8
          $java = Join-Path $env:JAVA_HOME_17_X64 'bin\java.exe'
          "java: $java $(Test-Path $java)" | Out-File $log -Append
          & $java -jar $jar.FullName $auto 2>&1 | Out-File $log -Append
          $bat = 'C:\veraPDF\verapdf.bat'
          "instalado: $(Test-Path $bat)" | Out-File $log -Append
          if (Test-Path $bat) {
            $env:JAVA_HOME = $env:JAVA_HOME_17_X64
            & $bat --version 2>&1 | Out-File $log -Append
            "PDFMASTER_REQUIRE_VERAPDF=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "JAVA_HOME=$env:JAVA_HOME_17_X64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Testar
        shell: pwsh
        env:
          PDFMASTER_REQUIRE_LIBREOFFICE: '1'
          PDFMASTER_REQUIRE_OCR: '1'
          PDFMASTER_REQUIRE_FFMPEG: '1'
        run: |
          dotnet test PDFMaster.Tests/PDFMaster.Tests.csproj -c Release --no-build -nologo --logger "console;verbosity=normal" 2>&1 | Tee-Object ci-out/test.log
          "test exit=$LASTEXITCODE" | Out-File ci-out/status.txt -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publicar executável
        shell: pwsh
        run: |
          dotnet publish PDFMaster.App/PDFMaster.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish -nologo 2>&1 | Tee-Object ci-out/publish.log
          "publish exit=$LASTEXITCODE" | Out-File ci-out/status.txt -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem publish | Select-Object Name, Length | Format-Table | Out-File ci-out/publish-files.txt -Encoding utf8

          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item publish/PDFMaster.exe portable/
          "Modo portatil: os dados do PDF Master ficam na pasta Data ao lado do executavel." | Out-File portable/portable.flag -Encoding utf8

      - name: Teste de inicialização e capturas de tela
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force | Out-Null } catch { "resolucao: $_" | Out-File ci-out/smoke.log -Append }
          $env:PDFMASTER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pdfm-smoke'
          $failed = $false

          function Capture($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path 'ci-out' "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          # Arquivos de exemplo para exercitar a importação: um PDF válido, uma cópia idêntica,
          # um arquivo que não é PDF com extensão .pdf e um tipo não suportado.
          $samples = Join-Path $env:RUNNER_TEMP 'pdfm-samples'
          New-Item -ItemType Directory -Force $samples | Out-Null
          $pdf = "%PDF-1.4`n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj`n2 0 obj<</Type/Pages/Kids[]/Count 0>>endobj`ntrailer<</Root 1 0 R>>`n%%EOF`n"
          [IO.File]::WriteAllText((Join-Path $samples 'contrato.pdf'), $pdf)
          [IO.File]::WriteAllText((Join-Path $samples 'contrato - copia.pdf'), $pdf)
          [IO.File]::WriteAllText((Join-Path $samples 'falso.pdf'), 'isto nao e um PDF')
          [IO.File]::WriteAllText((Join-Path $samples 'notas.txt'), 'texto simples')
          [IO.File]::WriteAllText((Join-Path $samples 'programa.exe'), 'MZ')

          # PDFs de várias páginas para as telas de ferramenta (gerados pelo próprio motor do programa).
          $env:PDFMASTER_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'pdfm-smoke-pdfs'
          dotnet test PDFMaster.Tests/PDFMaster.Tests.csproj -c Release --no-build -nologo --filter "FullyQualifiedName~SmokeSamples" 2>&1 | Out-File ci-out/samples.log -Encoding utf8
          $a = Join-Path $env:RUNNER_TEMP 'pdfm-smoke-pdfs\Relatorio.pdf'
          $b = Join-Path $env:RUNNER_TEMP 'pdfm-smoke-pdfs\Anexos.pdf'
          "amostras: $(Test-Path $a) $(Test-Path $b)" | Out-File ci-out/smoke.log -Append

          $out = Join-Path $env:RUNNER_TEMP 'pdfm-smoke-out'
          $s = $env:PDFMASTER_SMOKE_DIR
          $runs = @(
            @{ name = 'run-to-image';   args = @('--theme','light','--tool','pdf-to-image','--output',"`"$out`"",'--run',"`"$a`"") },
            @{ name = 'run-from-image'; args = @('--theme','light','--tool','image-to-pdf','--output',"`"$out`"",'--run',"`"$s\Foto.png`"","`"$s\Recibo.jpg`"") },
            @{ name = 'run-from-text';  args = @('--theme','light','--tool','text-html-to-pdf','--output',"`"$out`"",'--run',"`"$s\Notas.txt`"") },
            @{ name = 'run-to-word';    args = @('--theme','dark','--tool','pdf-to-word','--output',"`"$out`"",'--run',"`"$s\Texto.pdf`"") },
            @{ name = 'run-to-text';    args = @('--theme','light','--tool','pdf-to-text','--output',"`"$out`"",'--run',"`"$s\Texto.pdf`"") },
            @{ name = 'run-office';     wait = 75; args = @('--theme','light','--tool','office-to-pdf','--output',"`"$out`"",'--run',"`"$s\Carta.docx`"") },
            @{ name = 'run-compress';   wait = 20; args = @('--theme','light','--tool','compress','--output',"`"$out`"",'--run',"`"$s\Digitalizado.pdf`"") },
            @{ name = 'run-ocr';        wait = 60; args = @('--theme','light','--tool','ocr','--output',"`"$out`"",'--run',"`"$s\Escaneado.pdf`"") },
            @{ name = 'run-scan';       wait = 15; args = @('--theme','light','--tool','scan','--output',"`"$out`"",'--run',"`"$s\Foto.png`"","`"$s\Recibo.jpg`"") },
            @{ name = 'run-watermark';  args = @('--theme','light','--tool','watermark','--output',"`"$out`"",'--run',"`"$a`"") },
            @{ name = 'run-header';     args = @('--theme','light','--tool','header-footer','--output',"`"$out`"",'--run',"`"$b`"") },
            @{ name = 'run-forms';      args = @('--theme','light','--tool','forms','--output',"`"$out`"",'--run',"`"$s\Formulario.pdf`"") },
            @{ name = 'tool-editor';    wait = 12; args = @('--theme','light','--tool','edit-text',"`"$s\Formulario.pdf`"") },
            @{ name = 'tool-annotate';  wait = 12; args = @('--theme','dark','--tool','annotate',"`"$a`"") },
            @{ name = 'tool-forms';     args = @('--theme','light','--tool','forms',"`"$s\Formulario.pdf`"") },
            @{ name = 'tool-watermark'; args = @('--theme','light','--tool','watermark',"`"$a`"") },
            @{ name = 'light-edit';     args = @('--theme','light','--page','edit') },
            @{ name = 'run-video';      wait = 45; args = @('--theme','light','--tool','video-compress','--output',"`"$out`"",'--run',"`"$s\Video.avi`"") },
            @{ name = 'tool-video';     wait = 15; args = @('--theme','dark','--tool','video-compress',"`"$s\Video.avi`"") },
            @{ name = 'tool-ocr';       args = @('--theme','dark','--tool','ocr',"`"$s\Escaneado.pdf`"") },
            @{ name = 'light-ocr';      args = @('--theme','light','--page','ocr') },
            @{ name = 'run-merge';      args = @('--theme','light','--tool','merge','--output',"`"$out`"",'--run',"`"$a`"","`"$b`"") },
            @{ name = 'run-interleave'; args = @('--theme','light','--tool','interleave','--output',"`"$out`"",'--run',"`"$a`"","`"$b`"") },
            @{ name = 'run-split';      args = @('--theme','light','--tool','split','--output',"`"$out`"",'--run',"`"$a`"") },
            @{ name = 'run-pages';      args = @('--theme','light','--tool','reorder','--output',"`"$out`"",'--run',"`"$a`"") },
            @{ name = 'tool-viewer';    args = @('--theme','light','--tool','view',"`"$a`"") },
            @{ name = 'tool-pages';     args = @('--theme','light','--tool','reorder',"`"$a`"") },
            @{ name = 'tool-merge';     args = @('--theme','dark','--tool','merge',"`"$a`"","`"$b`"") },
            @{ name = 'tool-interleave'; args = @('--theme','light','--tool','interleave',"`"$a`"","`"$b`"") },
            @{ name = 'tool-split';     args = @('--theme','light','--tool','split',"`"$a`"") },
            @{ name = 'light-files';    args = @('--theme','light',"`"$samples`"","`"$(Join-Path $samples 'programa.exe')`"") },
            @{ name = 'light-home';     args = @('--theme','light','--page','home') },
            @{ name = 'dark-home';      args = @('--theme','dark','--page','home') },
            @{ name = 'light-organize'; args = @('--theme','light','--page','organize') },
            @{ name = 'dark-settings';  args = @('--theme','dark','--page','settings') },
            @{ name = 'light-history';  args = @('--theme','light','--page','history') }
          )
          foreach ($run in $runs) {
            $p = Start-Process -FilePath 'publish/PDFMaster.exe' -ArgumentList $run.args -PassThru
            $wait = if ($run.wait) { $run.wait } else { 10 }
            Start-Sleep -Seconds $wait
            try { Capture $run.name } catch { "captura $($run.name): $_" | Out-File ci-out/smoke.log -Append }
            if ($p.HasExited) {
              "$($run.name): o processo encerrou sozinho (codigo $($p.ExitCode))" | Out-File ci-out/smoke.log -Append
              $failed = $true
            } else {
              "$($run.name): em execucao apos $wait s, janela='$($p.MainWindowTitle)'" | Out-File ci-out/smoke.log -Append
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 1
            }
          }

          # Resultado das execuções feitas pela interface (--run).
          $expected = @('mesclado.pdf','intercalado.pdf','Relatorio_organizado.pdf') + (1..7 | ForEach-Object { 'Relatorio_{0:000}.pdf' -f $_ })
          $expected += (1..7 | ForEach-Object { 'Relatorio_p{0:000}.png' -f $_ })
          $expected += @('imagens.pdf','Notas.pdf','Texto.docx','Texto.txt','Carta.pdf','Digitalizado_comprimido.pdf','Escaneado_ocr.pdf','digitalizacao.pdf','Video_360p.mp4','Relatorio_marca-dagua.pdf','Anexos_cabecalho-rodape.pdf','Formulario_preenchido.pdf')
          foreach ($name in $expected) {
            $file = Join-Path $out $name
            if ((Test-Path $file) -and ((Get-Item $file).Length -gt 200)) {
              "saida ok: $name ($((Get-Item $file).Length) bytes)" | Out-File ci-out/smoke.log -Append
            } else {
              "saida AUSENTE: $name" | Out-File ci-out/smoke.log -Append
              $failed = $true
            }
          }
          if (Get-ChildItem $out -Filter '*.pdfmaster-tmp' -Force -ErrorAction SilentlyContinue) {
            "temporarios deixados na pasta de saida" | Out-File ci-out/smoke.log -Append
            $failed = $true
          }

          if (Test-Path (Join-Path $env:PDFMASTER_DATA_DIR 'Logs')) {
            Get-ChildItem (Join-Path $env:PDFMASTER_DATA_DIR 'Logs') | ForEach-Object { Copy-Item $_.FullName (Join-Path 'ci-out' ("app-" + $_.Name)) }
          }
          "smoke failed=$failed" | Out-File ci-out/status.txt -Append -Encoding utf8
          if ($failed) { exit 1 }

      - name: Guardar executável
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-win-x64
          path: publish/PDFMaster.exe
          if-no-files-found: error

      - name: Guardar versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-portatil-win-x64
          path: portable/
          if-no-files-found: error

      # Publica logs e capturas no ramo "ci-results" para conferência do resultado.
      - name: Publicar resultados do CI
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path ci-out)) { New-Item -ItemType Directory -Force ci-out | Out-Null }
          Set-Location ci-out
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Resultados do CI para ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results
